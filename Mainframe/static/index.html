<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JewAI v5 // CONTROL PANEL</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="cockpit">
  <!-- ЛЕВАЯ ПАНЕЛЬ: ИНДИКАТОРЫ -->
  <aside class="panel-left">
    <div class="portrait-frame">
      <div class="portrait-status" id="portrait-L">A</div>
      <div class="portrait-name" id="portrait-name-L">AGENT</div>
    </div>
    <div class="gauges">
      <div class="gauge-group">
        <span class="label">ALIVE</span>
        <div class="led" id="led-alive"></div>
      </div>
      <div class="gauge-group">
        <span class="label">CDP</span>
        <div class="led" id="led-cdp"></div>
      </div>
      <div class="gauge-group">
        <span class="label">WATCHDOG</span>
        <div class="led" id="led-wd"></div>
      </div>
      <div class="gauge-group">
        <span class="label">CMDS</span>
        <div class="gauge-value" id="val-cmds">0</div>
      </div>
    </div>
  </aside>

  <!-- ЦЕНТР: CRT-МОНИТОР -->
  <main class="panel-center">
    <div class="crt-screen">
      <div class="crt-header">
        <span>JEWAI BRIDGE // CHANNEL <span id="crt-ch">A</span></span>
        <span id="crt-time">00:00:00</span>
      </div>
      <div class="crt-content" id="crt-log">
        <!-- Сюда рендерится Ledger и логи -->
      </div>
      <div class="crt-footer">
        <button id="btn-selftest">DIAGNOSE</button>
        <button id="btn-ledger-full">EXPAND LEDGER</button>
      </div>
    </div>
  </main>

  <!-- ПРАВАЯ ПАНЕЛЬ: ТУМБЛЕРЫ -->
  <aside class="panel-right">
    <div class="switches">
      <button class="switch" id="btn-start">START</button>
      <button class="switch" id="btn-stop">STOP</button>
      <button class="switch" id="btn-reboot">REBOOT</button>
    </div>
    <div class="switches">
      <button class="switch" id="btn-pause">PAUSE</button>
      <button class="switch" id="btn-resume">RESUME</button>
    </div>
    <div class="switches">
      <button class="switch" id="btn-chrome">CHROME</button>
      <button class="switch" id="btn-reload">RELOAD F5</button>
    </div>
  </aside>
</div>

<script src="/app.js"></script>
</body>
</html>
