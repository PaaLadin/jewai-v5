<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JewAI v5 // MAINFRAME</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>JewAI v5 // MAINFRAME</h1>
  <div><span id="status-line">loading...</span> · <span id="clock"></span></div>
</header>
<nav>
  <button data-tab="launchpad" class="active">ПУЛЬТ</button>
  <button data-tab="mnemo">МНЕМОСХЕМА</button>
  <button data-tab="chat">ЧАТ</button>
  <button data-tab="roadmap">ПРОЕКТЫ</button>
  <button data-tab="llm">LLM</button>
</nav>
<main>
  <div id="tab-launchpad" class="tab">
    <div class="grid" id="lp-grid"></div>
  </div>
  <div id="tab-mnemo" class="tab hidden">
    <div class="grid" id="mnemo-grid"></div>
  </div>
  <div id="tab-chat" class="tab hidden">
    <div class="chat-box" id="chat-box"></div>
    <div class="chat-input">
      <input id="chat-input" placeholder="Сообщение в общий чат (broadcast)">
      <button id="chat-send">SEND</button>
    </div>
  </div>
  <div id="tab-roadmap" class="tab hidden">
    <div class="grid" id="projects-list"></div>
  </div>
  <div id="tab-llm" class="tab hidden">
    <div class="stub">
      <h2>LLM</h2>
      <p>Тут будет ЛЛМ.</p>
      <p style="color:#666; font-size:11px;">Ручной старт из панели (TODO).</p>
    </div>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
