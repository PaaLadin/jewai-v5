
<div class="lada-layout" style="display: flex; height: calc(100vh - 120px); gap: 15px; font-family: monospace;">
  <div class="lada-sidebar" style="width: 220px; display: flex; flex-direction: column; border-right: 1px solid #333; padding-right: 10px;">
    <button id="lada-new-chat" style="margin-bottom: 10px; padding: 8px; background: #111; color: #0f0; border: 1px solid #333; cursor: pointer; font-family: monospace;">+ Новый чат</button>
    <div id="lada-chat-list" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px;"></div>
  </div>
  
  <div class="lada-main" style="flex: 1; display: flex; flex-direction: column; position: relative;">
    <div id="lada-feed" style="flex: 1; overflow-y: auto; padding-bottom: 20px; display: flex; flex-direction: column; gap: 12px; font-size: 15px; line-height: 1.4;"></div>
    <div style="display: flex; gap: 10px; padding-top: 10px; border-top: 1px solid #333; background: #0a0a0a;">
      <textarea id="lada-input" style="flex: 1; resize: none; height: 60px; padding: 10px; background: #000; color: #0f0; border: 1px solid #333; font-family: monospace; font-size: 15px;" placeholder="Сообщение (Enter - отправить, Shift+Enter - перенос)..."></textarea>
      <button id="lada-send" style="padding: 0 20px; background: #111; color: #0f0; border: 1px solid #333; cursor: pointer; font-family: monospace; font-size: 15px;">Send</button>
    </div>
  </div>

  <div class="lada-side" style="width: 300px; overflow-y: auto; border-left: 1px solid #333; padding-left: 10px;">
    <div class="lada-side-section">
      <div class="lada-side-title">ИНДИКАТОРЫ</div>
      <div class="lada-ind-row"><span class="lada-lamp" id="lamp-llama"></span><span>llama-server</span></div>
      <div class="lada-ind-row"><span class="lada-lamp" id="lamp-orch"></span><span>оркестратор</span></div>
      <div class="lada-ind-row"><span class="lada-lamp" id="lamp-model"></span><span>модель загружена</span></div>
      <div class="lada-ind-row"><span class="lada-lamp" id="lamp-rag"></span><span>RAG индекс</span></div>
    </div>
    <div class="lada-side-section">
      <div class="lada-side-title">ПАРАМЕТРЫ</div>
      <label class="lada-param">temperature <span id="ptemp-val">0.7</span>
        <input type="range" id="lada-temp" min="0" max="2" step="0.05" value="0.7"></label>
      <label class="lada-param">top_p <span id="ptop-p-val">0.9</span>
        <input type="range" id="lada-top_p" min="0" max="1" step="0.05" value="0.9"></label>
      <label class="lada-param">top_k <span id="ptop-k-val">40</span>
        <input type="range" id="lada-top_k" min="0" max="100" step="1" value="40"></label>
      <label class="lada-param">max_tokens <span id="pmax-val">1024</span>
        <input type="range" id="lada-max_tokens" min="64" max="4096" step="64" value="1024"></label>
      <label class="lada-param">repeat_penalty <span id="prp-val">1.1</span>
        <input type="range" id="lada-repeat_penalty" min="0.8" max="2" step="0.05" value="1.1"></label>
      <label class="lada-param">seed <span id="pseed-val">-1</span>
        <input type="number" id="lada-seed" value="-1" style="width:100%"></label>
      <button id="lada-save-params" class="lada-btn">Сохранить</button>
    </div>
    <div class="lada-side-section">
      <div class="lada-side-title">TOOLS</div>
      <label class="lada-tool"><input type="checkbox" id="tool-get_time" checked>get_time</label>
      <label class="lada-tool"><input type="checkbox" id="tool-get_weather" checked>get_weather</label>
      <label class="lada-tool"><input type="checkbox" id="tool-check_email">check_email</label>
      <label class="lada-tool"><input type="checkbox" id="tool-ask_agent">ask_agent</label>
      <label class="lada-tool"><input type="checkbox" id="tool-query_rag" checked>query_rag</label>
      <label class="lada-tool"><input type="checkbox" id="tool-generate_image">generate_image</label>
      <label class="lada-tool"><input type="checkbox" id="tool-generate_audio">generate_audio</label>
      <div id="lada-tools-status" class="lada-hint">сохранение авто</div>
    </div>
  </div>
</div>
