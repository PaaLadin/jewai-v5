<script id="mnemo-logic-script">
document.addEventListener('DOMContentLoaded', function() {
  const logDiv = document.getElementById('action-log-content');

  document.body.addEventListener('click', async function(e) {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    e.preventDefault();
    const act = btn.dataset.act;
    const target = btn.dataset.target;
    const ts = new Date().toLocaleTimeString();
    if (logDiv) logDiv.innerHTML = '[' + ts + '] ' + act + ' ' + target + ' ...<br>' + logDiv.innerHTML;
    try {
      const r = await fetch('/api/' + act, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({target: target})
      });
      const j = await r.json();
      const status = j.ok ? 'SUCCESS' : 'FAIL: ' + (j.error || 'unknown');
      if (logDiv) logDiv.innerHTML = '[' + new Date().toLocaleTimeString() + '] ' + act + ' ' + target + ': ' + status + '<br>' + logDiv.innerHTML;
    } catch (err) {
      if (logDiv) logDiv.innerHTML = '[' + new Date().toLocaleTimeString() + '] ' + act + ' ' + target + ': ERR ' + err + '<br>' + logDiv.innerHTML;
    }
  });

  const canvas = document.getElementById('mnemo-fx');
  const wrap = document.getElementById('mnemo-wrap');
  if (!canvas || !wrap) return;
  const ctx = canvas.getContext('2d');
  let particles = [];
  let lastCounts = {};

  function resize() {
    canvas.width = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
  }
  window.addEventListener('resize', resize);
  setTimeout(resize, 200);

  function getCenter(elId) {
    const el = document.getElementById(elId);
    if (!el) return null;
    const r = el.getBoundingClientRect();
    const rW = wrap.getBoundingClientRect();
    return { x: r.left - rW.left + r.width / 2, y: r.top - rW.top + r.height / 2, el: el };
  }

  function targetFor(last) {
    if (!last) return 'mnemo-mainframe';
    const op = (last.op || '').toLowerCase();
    const path = ((last.path || '') + ' ' + ((last.result && last.result.path) || '') + ' ' + (last.detail || '')).toLowerCase();
    if (op === 'read' || op === 'list' || op === 'hash') {
      if (path.indexOf('rag') >= 0) return 'mnemo-rag';
      if (path.indexOf('profile') >= 0) return 'mnemo-profiles';
      if (path.indexOf('project') >= 0) return 'mnemo-projects';
      return 'mnemo-rag';
    }
    if (op === 'write' || op === 'mkdir' || op === 'delete') {
      if (path.indexOf('project') >= 0) return 'mnemo-projects';
      return 'mnemo-sandbox';
    }
    if (op === 'run') return 'mnemo-sandbox';
    return 'mnemo-mainframe';
  }

  function flashTarget(el) {
    if (!el) return;
    el.classList.remove('flashing');
    void el.offsetWidth;
    el.classList.add('flashing');
    setTimeout(function() { el.classList.remove('flashing'); }, 1800);
  }

  function spawnPulse(sourceId, targetId) {
    const src = getCenter(sourceId);
    const tgt = getCenter(targetId);
    if (!src || !tgt) return;
    particles.push({ sx: src.x, sy: src.y, ex: tgt.x, ey: tgt.y, prog: 0, dur: 0.9, fading: false, alpha: 1, trail: [], targetEl: tgt.el });
  }

  async function pollTelemetry() {
    try {
      const r = await fetch('/api/telemetry');
      const d = await r.json();
      if (!d || !d.channels) return;
      for (const L in d.channels) {
        const t = d.channels[L];
        const cur = t.count || 0;
        const prev = lastCounts[L] || 0;
        if (cur > prev && t.last) spawnPulse('mnemo-agent-' + L, targetFor(t.last));
        lastCounts[L] = cur;
      }
    } catch (e) {}
  }

  async function pollStatus() {
    try {
      const r = await fetch('/api/status');
      const d = await r.json();
      if (!d || !d.channels) return;
      const ch = d.channels['A'];
      if (ch) {
        const setLamp = (id, on) => { const el = document.getElementById(id); if (el) el.className = 'm-lamp-sm ' + (on ? '' : 'off'); };
        setLamp('lamp-A-agent', ch.agent_alive);
        setLamp('lamp-A-bridge', ch.agent_alive && ch.cdp_alive);
        setLamp('lamp-A-chrome', ch.cdp_alive);
        setLamp('lamp-A-status', ch.agent_alive);
        const txt = document.getElementById('text-A-status'); if (txt) txt.textContent = ch.agent_alive ? 'ONLINE' : 'OFFLINE';
      }
    } catch (e) {}
  }

  async function pollSysTel() {
    try {
      const r = await fetch('/api/sys_telemetry');
      const d = await r.json();
      if (!d || !d.ok) return;
      const fmt = b => (b/1024/1024).toFixed(1) + ' MB';
      const setInfo = (id, txt) => { const el = document.getElementById('info-'+id); if (el) el.textContent = txt; };
      if (d.sandbox) setInfo('sandbox', fmt(d.sandbox.size) + ' / ' + d.sandbox.files + ' f');
      if (d.projects) setInfo('projects', fmt(d.projects.size) + ' / ' + d.projects.files + ' f');
      if (d.rag) setInfo('rag', fmt(d.rag.size) + ' / ' + d.rag.files + ' f');
      if (d.profiles) setInfo('profiles', fmt(d.profiles.size) + ' / ' + d.profiles.files + ' f');
      if (d.services) {
        setInfo('llm', d.services.llm ? '\u25cf ONLINE' : '\u25cb OFFLINE');
        setInfo('proxy', d.services.proxy ? '\u25cf ONLINE' : '\u25cb OFFLINE');
        setInfo('rebirth', d.services.rebirth ? '\u25cf ONLINE' : '\u25cb OFFLINE');
        setInfo('mailbot', d.services.mailbot ? '\u25cf ONLINE' : '\u25cb OFFLINE');
      }
    } catch (e) {}
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      if (!p.fading) {
        p.prog += 0.016 / p.dur;
        if (p.prog >= 1) { p.prog = 1; p.fading = true; if (p.targetEl) flashTarget(p.targetEl); }
      } else {
        p.alpha -= 0.016 / 0.5;
        if (p.alpha <= 0) { particles.splice(i, 1); continue; }
      }
      const cx = p.sx + (p.ex - p.sx) * p.prog;
      const cy = p.sy + (p.ey - p.sy) * p.prog;

      if (!p.fading) {
        p.trail.push({ x: cx, y: cy, age: 0 });
        if (p.trail.length > 25) p.trail.shift();
      }

      for (let k = 0; k < p.trail.length; k++) {
        const t = p.trail[k];
        t.age += 0.016;
        const a = Math.max(0, 1 - t.age / 0.6) * (k / p.trail.length);
        if (a <= 0) continue;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 2 + (k / p.trail.length) * 4, 0, Math.PI * 2);
        ctx.fillStyle = '#0f0';
        ctx.globalAlpha = a;
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      if (!p.fading) {
        ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#fff'; ctx.shadowColor = '#0f0'; ctx.shadowBlur = 20; ctx.fill(); ctx.shadowBlur = 0;
      } else {
        ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#0f0'; ctx.globalAlpha = p.alpha; ctx.fill(); ctx.globalAlpha = 1;
      }
    }
    requestAnimationFrame(render);
  }

  pollStatus(); pollSysTel(); pollTelemetry();
  setInterval(pollStatus, 5000); setInterval(pollSysTel, 5000); setInterval(pollTelemetry, 2000);
  requestAnimationFrame(render);
});
</script>
