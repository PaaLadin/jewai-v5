<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JewAI // INSTALLER</title>
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>
<div id="boot-screen">
    <div>Press any key to step in the future</div>
</div>

<div id="splash-screen" style="display:none;">
    <div id="splash-logo">
        <span class="letter l-j">J</span><span class="letter l-e">e</span><span class="letter l-w">w</span>
        <span class="letter l-ai">AI</span>
    </div>
</div>

<div class="crt" id="crt-container" style="display:none;">
  <div class="terminal" id="term"></div>
  <div class="input-line" id="inputLine" style="display:none;">
    <span class="prompt" id="prompt">&gt;</span>
    <span id="inputText"></span><span class="cursor">_</span>
  </div>
</div>

<script src="app_audio.js?v=11"></script>
<script src="app.js?v=11"></script>
</body>
</html>
