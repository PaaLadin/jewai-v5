<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>JewAI // INSTALLER</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="crt">
  <div class="topbar">
    <div class="top-left">JewAI // SYSTEM INSTALLER</div>
    <div class="top-center" id="clock">--:--:--</div>
  </div>
  <div class="screen active">
    <div class="lp-wrap">
      <div class="panel-title" style="text-align:center; font-size: 1.5em; margin-bottom: 20px;">УСТАНОВКА JEWAI v5</div>
      <form id="installForm" style="display: flex; flex-direction: column; gap: 10px; max-width: 500px; margin: 0 auto;">
        <label>Путь установки: <input type="text" id="root" value="C:\JewAI" style="width: 100%;"></label>
        <label>Портов агентов (база): <input type="number" id="basePort" value="8760" style="width: 100%;"></label>
        <label>Количество агентов: <input type="number" id="agentCount" value="4" min="1" max="10" style="width: 100%;"></label>
        <label>Порт мейнфрейма: <input type="number" id="chatPort" value="8670" style="width: 100%;"></label>
        <label>Порт DoH-прокси: <input type="number" id="proxyPort" value="9999" style="width: 100%;"></label>
        <button type="submit" class="pbtn" style="margin-top: 15px;">ЗАПУСТИТЬ</button>
      </form>
      <div id="log" style="margin-top: 20px; color: #0f0; font-family: monospace; white-space: pre-wrap; height: 200px; overflow-y: auto;"></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
