<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>JewAI v5</title>
<style>
  :root {
    --green: #00ff66;
    --green-dim: #0a8a3a;
    --green-glow: rgba(0,255,102,0.55);
    --amber: #ffb000;
    --red: #ff3b3b;
    --cyan: #33d6ff;
    --purple: #c573ff;
    --bg: #08110a;
    --metal1: #1b1a16;
    --metal2: #2a2822;
    --text-dim: #0a8a3a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
  body {
    background: #000;
    color: var(--green);
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
  }

  /* CRT monitor: metal frame + scanlines + radial gradient */
  .monitor {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 8px;
    gap: 6px;
    background: var(--metal2);
    border: 8px solid var(--metal2);
    outline: 3px solid var(--metal1);
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    margin: 4px;
    box-shadow: 0 0 0 1px #000 inset, 0 0 40px rgba(0,255,102,0.08);
  }
  /* scanlines overlay */
  .monitor::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    background-image: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.15) 0px,
      rgba(0,0,0,0.15) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 10;
    border-radius: 12px;
  }

  .agent-header {
    flex-shrink: 0;
    background: #000;
    border: 2px solid var(--green-dim);
    border-radius: 6px;
    padding: 6px 4px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 2;
  }
  .agent-letter {
    font-size: 32px;
    font-weight: bold;
    color: var(--green);
    text-shadow: 0 0 10px var(--green), 0 0 20px var(--green-glow);
    line-height: 1;
    letter-spacing: 2px;
  }
  .agent-name {
    font-size: 11px;
    color: var(--green-dim);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 2px;
    text-shadow: 0 0 6px var(--green-glow);
  }

  /* CRT screen with radial gradient from center */
  .crt-screen {
    flex: 1;
    min-height: 100px;
    background:
      radial-gradient(ellipse at center, #0d1a0d 0%, #04100a 60%, #000 100%);
    border: 2px solid var(--green-dim);
    border-radius: 8px;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(0,255,102,0.15) inset;
    z-index: 2;
  }
  /* inner vignette */
  .crt-screen::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    background: radial-gradient(circle at center, transparent 55%, rgba(0,0,0,0.55) 100%);
    z-index: 4;
  }
  .crt-header {
    display: flex;
    justify-content: space-between;
    padding: 3px 8px;
    font-size: 9px;
    color: var(--green);
    border-bottom: 1px solid var(--green-dim);
    background: rgba(0,20,8,0.4);
    z-index: 3;
    position: relative;
    text-shadow: 0 0 6px var(--green-glow);
    letter-spacing: 2px;
  }
  .crt-content {
    flex: 1;
    padding: 6px 8px;
    font-size: 11px;
    line-height: 1.4;
    color: var(--green);
    text-shadow: 0 0 3px var(--green-glow);
    overflow-y: auto;
    white-space: pre-wrap;
    z-index: 3;
    position: relative;
  }
  .crt-content::-webkit-scrollbar { width: 6px; }
  .crt-content::-webkit-scrollbar-track { background: rgba(0,20,8,0.3); }
  .crt-content::-webkit-scrollbar-thumb { background: var(--green-dim); border-radius: 3px; }
  .scroll-lock-label {
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 3px;
    color: var(--green-dim);
    font-size: 9px;
    letter-spacing: 1px;
  }
  .scroll-lock-label input { cursor: pointer; accent-color: var(--green); margin: 0; }

  /* panels */
  .bottom-panel {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: 35% 65%;
    gap: 6px;
    align-items: stretch;
    position: relative;
    z-index: 2;
  }
  .panel-left, .panel-right {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 4px;
    background: rgba(0,20,8,0.35);
    border: 1px solid var(--green-dim);
    border-radius: 6px;
    padding: 6px;
    height: 100%;
  }

  /* walk sign */
  .walk-sign {
    flex-shrink: 0;
    background: #000;
    border: 2px solid var(--amber);
    border-radius: 6px;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 60px;
    width: 100%;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(255,176,0,0.15) inset;
  }
  .sign-svg { width: 100%; height: 100%; }
  .svg-dont { fill: var(--text-dim); font-family: sans-serif; font-weight: bold; font-size: 22px; transition: all 0.2s; letter-spacing: 1px; }
  .svg-walk { fill: var(--text-dim); font-family: sans-serif; font-weight: bold; font-size: 26px; transition: all 0.2s; letter-spacing: 1px; }
  .walk-sign.paused .svg-dont { fill: var(--red); filter: drop-shadow(0 0 6px var(--red)); }
  .walk-sign.running .svg-walk { fill: #fff; filter: drop-shadow(0 0 8px var(--green)); }
  .walk-sign.error .svg-dont { fill: var(--red); filter: drop-shadow(0 0 6px var(--red)); }

  /* LEDs */
  .led-row {
    flex-shrink: 0;
    height: 26px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--green-dim);
    font-weight: bold;
    border-bottom: 1px dashed var(--green-dim);
    padding: 0 4px;
    letter-spacing: 1px;
    text-shadow: 0 0 4px var(--green-glow);
  }
  .led-group { display: flex; gap: 4px; }
  .led { width: 12px; height: 12px; border-radius: 50%; background: #222; box-shadow: 0 0 0 1px #000 inset; }
  .led.red { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .led.green { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .led.yellow { background: var(--amber); box-shadow: 0 0 8px var(--amber); }

  /* pause */
  .pause-btn {
    flex-shrink: 0;
    height: 60px;
    background: rgba(0,20,8,0.35);
    border: 2px solid var(--green-dim);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    margin-bottom: 2px;
    transition: all 0.2s;
  }
  .pause-btn:hover { border-color: var(--green); box-shadow: 0 0 12px rgba(0,255,102,0.25); }
  .pause-btn svg { height: 30px; }
  .icon-pause, .icon-play { fill: var(--green-dim); transition: fill 0.2s; }
  .pause-btn.active .icon-pause { fill: var(--amber); filter: drop-shadow(0 0 6px var(--amber)); }
  .pause-btn:not(.active) .icon-play { fill: var(--green); filter: drop-shadow(0 0 6px var(--green)); }

  /* reboot */
  .reboot-btn {
    flex-shrink: 0;
    height: 28px;
    width: 100%;
    padding: 0;
    background: rgba(60,10,10,0.4);
    border: 1px solid var(--red);
    color: var(--red);
    font-weight: bold;
    font-size: 11px;
    cursor: pointer;
    border-radius: 4px;
    margin-bottom: 2px;
    letter-spacing: 2px;
    text-shadow: 0 0 6px rgba(255,59,59,0.6);
    transition: all 0.2s;
  }
  .reboot-btn:hover { background: rgba(255,59,59,0.15); }
  .reboot-btn:active { transform: translateY(1px); }

  /* control rows */
  .control-row {
    flex-shrink: 0;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }
  .switch { position: relative; width: 34px; height: 20px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #0a1a0a;
    border-radius: 20px;
    transition: .3s;
    border: 1px solid var(--green-dim);
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 14px; width: 14px;
    left: 2px; bottom: 2px;
    background: var(--green-dim);
    border-radius: 50%;
    transition: .3s;
  }
  input:checked + .slider { background: rgba(0,255,102,0.15); border-color: var(--green); }
  input:checked + .slider:before { transform: translateX(14px); background: var(--green); box-shadow: 0 0 6px var(--green); }

  .control-row input[type="number"] {
    flex: 1;
    height: 100%;
    width: 100%;
    background: #000;
    border: 1px solid var(--green-dim);
    color: var(--green);
    font-family: inherit;
    padding: 0 4px;
    text-align: center;
    font-size: 12px;
    text-shadow: 0 0 4px var(--green-glow);
  }
  .unit-label { font-size: 10px; color: var(--green-dim); white-space: nowrap; letter-spacing: 1px; }
  .btn-save {
    height: 100%;
    background: rgba(0,20,8,0.35);
    border: 1px solid var(--green-dim);
    color: var(--green);
    font-size: 10px;
    padding: 0 6px;
    cursor: pointer;
    border-radius: 4px;
    letter-spacing: 1px;
    text-shadow: 0 0 4px var(--green-glow);
  }
  .btn-save:hover { border-color: var(--green); background: rgba(0,255,102,0.08); }

  /* selftest */
  .self-test-btn {
    flex-shrink: 0;
    width: 100%;
    padding: 8px;
    background: rgba(0,20,8,0.35);
    border: 1px solid var(--green-dim);
    color: var(--green);
    font-weight: bold;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 6px;
    text-shadow: 0 0 6px var(--green-glow);
    position: relative;
    z-index: 2;
  }
  .self-test-btn:hover { border-color: var(--green); box-shadow: 0 0 10px rgba(0,255,102,0.15); }

  /* metal plate */
  .metal-plate {
    flex-shrink: 0;
    text-align: center;
    font-size: 8px;
    color: var(--green-dim);
    background: var(--metal1);
    border: 1px solid #000;
    padding: 3px;
    border-radius: 3px;
    letter-spacing: 2px;
    position: relative;
    z-index: 2;
  }

  /* URL row */
  .input-row {
    flex-shrink: 0;
    display: flex;
    gap: 4px;
    height: 26px;
    position: relative;
    z-index: 2;
  }
  .input-row input {
    flex: 1;
    background: #000;
    border: 1px solid var(--green-dim);
    color: var(--green);
    padding: 0 6px;
    font-family: inherit;
    font-size: 10px;
    text-shadow: 0 0 4px var(--green-glow);
  }
  .input-row button {
    background: rgba(0,20,8,0.35);
    border: 1px solid var(--green-dim);
    color: var(--green);
    padding: 0 10px;
    cursor: pointer;
    font-size: 10px;
    font-family: inherit;
    border-radius: 4px;
    letter-spacing: 1px;
  }
  .input-row button:hover { border-color: var(--green); background: rgba(0,255,102,0.08); }
</style>
</head>
<body>
<div class="monitor">
  <header class="agent-header"><div class="agent-letter" id="agent-letter">?</div><div class="agent-name" id="agent-name">UNKNOWN</div></header>
  <main class="crt-screen">
    <div class="crt-header"><span>LOG</span><label class="scroll-lock-label"><input type="checkbox" id="scroll-lock"> LOCK</label></div>
    <div class="crt-content" id="crt-log"><div>[SYS] Инициализация...</div></div>
  </main>
  <footer class="bottom-panel">
    <div class="panel-left">
      <div class="walk-sign" id="walk-sign"><svg viewBox="0 0 100 60" class="sign-svg"><text x="50" y="22" text-anchor="middle" class="svg-dont" id="svg-dont">DON'T</text><text x="50" y="50" text-anchor="middle" class="svg-walk" id="svg-walk">WALK</text></svg></div>
      <div class="led-row"><span>CDP</span><div class="led-group"><div class="led red" id="led-cdp"></div></div></div>
      <div class="led-row"><span>WATCHDOG</span><div class="led-group"><div class="led red" id="led-wd"></div></div></div>
      <div class="led-row"><span>RECOVERY</span><div class="led-group"><div class="led red" id="led-rec"></div></div></div>
    </div>
    <div class="panel-right">
      <button class="pause-btn" id="btn-pause"><svg viewBox="0 0 40 20"><rect x="8" y="2" width="6" height="16" rx="1" class="icon-pause" /><rect x="16" y="2" width="6" height="16" rx="1" class="icon-pause" /><polygon points="26,2 36,10 26,18" class="icon-play" /></svg></button>
      <button class="reboot-btn" id="btn-reboot">REBOOT</button>
      <div class="control-row"><label class="switch"><input type="checkbox" id="sw-wd"><span class="slider"></span></label><span class="unit-label">(сек)</span><input type="number" id="inp-wd" value="300"><button class="btn-save" id="save-wd">SAVE</button></div>
      <div class="control-row"><label class="switch"><input type="checkbox" id="sw-rec"><span class="slider"></span></label><span class="unit-label">(сек)</span><input type="number" id="inp-rec" value="60"><button class="btn-save" id="save-rec">SAVE</button></div>
    </div>
  </footer>
  <button class="self-test-btn" id="btn-selftest">SELF-TEST</button>
  <div class="input-row"><input id="agentUrl" placeholder="http://127.0.0.1:8666"><button id="btnSaveUrl">PING</button></div>
  <footer class="metal-plate">JEWAI v5 // REV 0.1.0-dev</footer>
</div>
<script src="app.js"></script>
</body>
</html>
